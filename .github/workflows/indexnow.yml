name: Prévenir Bing (IndexNow)

# Après chaque mise en ligne, signale à Bing (et aux moteurs IndexNow) les pages
# du sitemap qui ont changé. Lancement manuel : envoie tout le sitemap.
# La clé est publiée à la racine : 661f65e27cb2fd8a62d6573623b02a7dc3888a5e.txt

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Laisser GitHub Pages mettre le site en ligne
        run: sleep 120
      - name: Envoyer les adresses à IndexNow
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, urllib.request

          HOST = "contegames.com"
          KEY = "661f65e27cb2fd8a62d6573623b02a7dc3888a5e"
          sitemap = open("sitemap.xml", encoding="utf-8").read()
          known = re.findall(r"<loc>\s*(https://contegames\.com/[^<\s]*)\s*</loc>", sitemap)

          before = os.environ.get("BEFORE", "")
          if os.environ["EVENT"] == "push" and before and set(before) != {"0"}:
              changed = subprocess.run(
                  ["git", "diff", "--name-only", before, os.environ["AFTER"]],
                  capture_output=True, text=True, check=True,
              ).stdout.split()
              if "sitemap.xml" in changed:
                  urls = known
              else:
                  wanted = set()
                  for path in changed:
                      if not path.endswith(".html"):
                          continue
                      url = f"https://{HOST}/" + path
                      if url.endswith("/index.html"):
                          url = url[: -len("index.html")]
                      wanted.add(url)
                  urls = [u for u in known if u in wanted]
          else:
              urls = known

          if not urls:
              print("Aucune page du sitemap n'a changé : rien à envoyer.")
              sys.exit(0)

          body = json.dumps({
              "host": HOST,
              "key": KEY,
              "keyLocation": f"https://{HOST}/{KEY}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"IndexNow a répondu {resp.status} pour {len(urls)} adresse(s).")
          for u in urls:
              print(" ", u)
          PY
