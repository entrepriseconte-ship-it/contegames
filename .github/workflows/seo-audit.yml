name: Audit SEO international

on:
  pull_request:
    paths:
      - "**/*.html"
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "styles.css"
      - "tools/check_seo.py"
      - "tools/check_render.mjs"
      - ".github/workflows/seo-audit.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "index.html"
      - "sitemap.xml"
      - "robots.txt"
      - "tools/check_seo.py"
      - "tools/check_render.mjs"
      - ".github/workflows/seo-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify 30 languages, 150 pages and links
        run: python tools/check_seo.py
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real browser on mobile and desktop
        run: |
          python -m http.server 8765 > /tmp/contegames-http.log 2>&1 &
          node tools/check_render.mjs
