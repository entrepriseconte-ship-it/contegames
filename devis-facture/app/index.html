/* Document PDF : toujours clair, quel que soit le thème */

.doc{background:#fff;color:#222;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;width:190mm;padding:2mm 0;line-height:1.4}
.doc table{font-variant-numeric:tabular-nums}

<script>
/* ================= Données ================= */
const ENTREPRISE_DEFAUT = {
  nom:"", statut:"EI", commercial:"",
  adresse:"", cp:"", ville:"", email:"", tel:"", site:"",
  siret:"", ape:"", tvaIntra:"", franchiseTva:true, iban:"", bic:"", banque:"",
  logo:"", validiteDevis:30, delaiPaiement:30, conditions:"Paiement par virement bancaire.", assurance:"", nature:"Prestation de services", activites:"", parActivite:{}
};
const D = { entreprise:{...ENTREPRISE_DEFAUT}, clients:[], devis:[], factures:[], compteurs:{} };
const S = { db:null, downloads:null, peutEcrire:true, local:true, charge:{clients:false,devis:false,factures:false} };
const CLE_LOCALE = "cg-devis-factures-public-v1";

function chargerLocal(){ try{ const x=JSON.parse(localStorage.getItem(CLE_LOCALE)); if(x){ Object.assign(D,x); D.entreprise={...ENTREPRISE_DEFAUT,...x.entreprise}; } }catch(e){} }
function sauverLocal(){ try{ localStorage.setItem(CLE_LOCALE, JSON.stringify(D)); }catch(e){} }

async function ecrire(coll, obj){
  const liste = D[coll], i = liste.findIndex(x=>x.id===obj.id);
  if(i<0) liste.push(obj); else liste[i]=obj;
  if(S.db){ await S.db.collection(coll).doc(obj.id).set(JSON.parse(JSON.stringify(obj))); } else sauverLocal();
}
async function effacer(coll, id){
  D[coll] = D[coll].filter(x=>x.id!==id);
  if(S.db) await S.db.collection(coll).doc(id).delete(); else sauverLocal();
}
async function ecrireEntreprise(){
  if(S.db) await S.db.doc("config/entreprise").set(JSON.parse(JSON.stringify(D.entreprise))); else sauverLocal();
}
const attendre = ms => new Promise(r=>setTimeout(r,ms));
/* Numéro suivant, sans trou ni doublon même à plusieurs PC */
async function prochainNumero(type, date){
  const an = (date||aujourd()).slice(0,4), cle = type+an, prefixe = type+"-"+an+"-";
  const maxListe = (type==="D"?D.devis:D.factures).filter(x=>(x.numero||"").startsWith(prefixe)).reduce((m,x)=>Math.max(m, parseInt(x.numero.slice(prefixe.length))||0),0);
  let n;
  if(S.db){
    const ref = S.db.doc("config/compteurs"), moi = "p"+uid();
    let ok=false;
    for(let essai=0; essai<12 && !ok; essai++){ const r = await ref.acquire({holder:moi, ttlMs:8000}); ok=r.acquired; if(!ok) await attendre(500+Math.random()*500); }
    if(!ok) throw new Error("Un autre PC crée un document en ce moment. Réessayez dans quelques secondes.");
    const snap = await ref.get(); const c = snap.exists ? {...snap.data()} : {};
    n = Math.max(Number(c[cle])||0, maxListe)+1; c[cle]=n;
    await ref.set(c);
  } else { n = Math.max(D.compteurs[cle]||0, maxListe)+1; D.compteurs[cle]=n; sauverLocal(); }
  return prefixe+String(n).padStart(3,"0");
}

/* ================= Outils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro = n => (Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const euroRond = n => (Number(n)||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const aujourd = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const dateFr = d => d ? new Date(d+"T12:00:00").toLocaleDateString("fr-FR") : "";
const plusJours = (d,n) => { const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+Number(n||0)); return x.toISOString().slice(0,10); };
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const MOIS_LONG = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function toast(t, ms=2800){ const e=$("#toast"); e.textContent=t; e.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>e.hidden=true,ms); }
function demander(texte, oui="Confirmer", danger=false){
  return new Promise(res=>{
    $("#confirm-zone").innerHTML = `<div class="fond-modal" style="z-index:20"><div class="modal etroit"><p style="margin-top:0">${texte}</p>
      <div class="barre"><button class="btn ${danger?"danger":"or"}" id="cf_oui">${esc(oui)}</button><button class="btn leger" id="cf_non">Annuler</button></div></div></div>`;
    const fin = v => { $("#confirm-zone").innerHTML=""; res(v); };
    $("#cf_oui").onclick=()=>fin(true); $("#cf_non").onclick=()=>fin(false); $("#cf_oui").focus();
  });
}
function prevenir(texte){ return demander(texte, "D'accord").then(()=>{}); }
function calculer(doc){
  let ht=0, tva=0; const f=D.entreprise.franchiseTva;
  (doc.lignes||[]).forEach(l=>{ const m=(Number(l.qte)||0)*(Number(l.pu)||0); ht+=m; if(!f) tva+=m*(Number(l.tva)||0)/100; });
  const remise = Math.min(Number(doc.remise)||0, ht);
  if(remise && ht) tva = tva*(ht-remise)/ht;
  ht -= remise; const acompte = Number(doc.acompte)||0;
  return {ht, tva, ttc:ht+tva, remise, acompte, reste:ht+tva-acompte};
}
const client = id => D.clients.find(c=>c.id===id) || {nom:"(client inconnu)"};
const facturesValides = () => D.factures.filter(f=>f.statut!=="annulee");
function etatFacture(f){
  if(f.statut==="annulee") return ["Annulée","p-gris"];
  if(f.paye) return ["Payée","p-vert"];
  if(f.echeance && f.echeance < aujourd()) return ["En retard","p-rouge"];
  return ["À payer","p-orange"];
}
const ETATS_DEVIS = {brouillon:["Brouillon","p-gris"],envoye:["Envoyé","p-bleu"],accepte:["Accepté","p-vert"],refuse:["Refusé","p-rouge"],facture:["Facturé","p-violet"]};
const triNum = (a,b) => (b.numero||"").localeCompare(a.numero||"");
/* ===== Essai gratuit de 7 jours, puis abonnement ===== */
const ESSAI_JOURS = 7, URL_ABONNEMENT = "/devis-facture/#tarif";
const CLE_ESSAI = "cg-devis-essai-debut", CLE_LICENCE = "cg-devis-licence";
const ESSAI = { debut:null, restant:ESSAI_JOURS, fini:false, abonne:false };
function lireEssai(){
  try{
    ESSAI.abonne = !!localStorage.getItem(CLE_LICENCE);
    let d = localStorage.getItem(CLE_ESSAI);
    if(!d){ d = new Date().toISOString(); localStorage.setItem(CLE_ESSAI, d); }
    ESSAI.debut = d;
    const ecoule = Math.floor((Date.now() - new Date(d).getTime()) / 864e5);
    ESSAI.restant = Math.max(0, ESSAI_JOURS - ecoule);
    ESSAI.fini = !ESSAI.abonne && ESSAI.restant <= 0;
  }catch(e){ /* stockage indisponible : on laisse l'essai ouvert */ }
}
function bandeauEssai(){
  if(ESSAI.abonne) return "";
  if(ESSAI.fini) return `<div class="alerte"><b>Votre essai gratuit de ${ESSAI_JOURS} jours est terminé.</b> Vos devis et factures restent consultables, téléchargeables en PDF et exportables. Pour en créer de nouveaux, passez à la version complète. <a href="${URL_ABONNEMENT}">Voir l'abonnement</a></div>`;
  return `<div class="info">Essai gratuit : <b>${ESSAI.restant} jour${ESSAI.restant>1?"s":""} restant${ESSAI.restant>1?"s":""}</b> sur ${ESSAI_JOURS}. Toutes les fonctions sont ouvertes. <a href="${URL_ABONNEMENT}">Voir l'abonnement</a></div>`;
}
function bloquerSiLecture(){ if(!S.peutEcrire){ toast(ESSAI.fini?"Essai terminé : abonnez-vous pour créer de nouveaux documents. Vos données restent consultables et exportables.":"Accès en lecture seule : consultation et export uniquement.",5000); return true; } return false; }

/* ================= Navigation ================= */
let vueActive = "accueil", anneeTB = Number(aujourd().slice(0,4)), activiteTB = "";
const profil = act => { const e=D.entreprise, p=(e.parActivite||{})[act]||{}; return {commercial:p.commercial||e.commercial, email:p.email||e.email, site:(p.site!==undefined&&p.site!=="")?p.site:e.site, assurance:p.assurance!==undefined?p.assurance:e.assurance, logo:p.logo||e.logo}; };
const listeActivites = () => String(D.entreprise.activites||"").split(",").map(x=>x.trim()).filter(Boolean);
$("#nav").addEventListener("click", e=>{ const v=e.target.closest("button")?.dataset.vue; if(v){ vueActive=v; afficher(); window.scrollTo(0,0); }});
function afficher(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("actif", b.dataset.vue===vueActive));
  ({accueil:vueAccueil, devis:vueDevis, factures:vueFactures, clients:vueClients, reglages:vueReglages, export:vueExport})[vueActive]();

/* ================= Tableau de bord ================= */
function caParMois(annee){
  const t = Array(12).fill(0), nb = Array(12).fill(0), enc = Array(12).fill(0);
  facturesValides().filter(f=>!activiteTB||f.activite===activiteTB).forEach(f=>{
    if((f.date||"").startsWith(annee+"-")){ const m=Number(f.date.slice(5,7))-1; t[m]+=calculer(f).ht; nb[m]++; }
    if(f.paye && (f.datePaiement||"").startsWith(annee+"-")){ enc[Number(f.datePaiement.slice(5,7))-1]+=calculer(f).ttc; }
  });
  return {t, nb, enc};
}
function graphique(cur, prec){
  const W=760,H=270,g=46,b=34,h=16,haut=H-b-h, max0=Math.max(...cur,...prec,0);
  const pas = max0<=0?250: Math.pow(10,Math.floor(Math.log10(max0/4)));
  const unite = [1,2,2.5,5,10].map(k=>k*pas).find(u=>u*4>=max0) || pas*10;
  const max = unite*4, larg=(W-g-8)/12, y=v=>h+haut-(v/max)*haut;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d'affaires HT par mois">`;
  for(let i=0;i<=4;i++){ const v=unite*i, yy=y(v);
    s+=`<line x1="${g}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="var(--ligne)" stroke-width="1"/>`+
       `<text x="${g-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--doux)">${v>=1000?(v/1000).toLocaleString("fr-FR")+" k":v.toLocaleString("fr-FR")}</text>`; }
  cur.forEach((v,i)=>{ const x=g+i*larg, bw=larg*0.34;
    const p=prec[i]; if(p>0) s+=`<rect x="${x+larg*0.14}" y="${y(p)}" width="${bw}" height="${y(0)-y(p)}" rx="3" fill="var(--barre-n1)"><title>${MOIS_LONG[i]} ${anneeTB-1} : ${euro(p)} HT</title></rect>`;
    if(v>0){ s+=`<rect x="${x+larg*0.14+bw+2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="3" fill="var(--barre)"><title>${MOIS_LONG[i]} ${anneeTB} : ${euro(v)} HT</title></rect>`;
      s+=`<text x="${x+larg*0.14+bw*1.5+2}" y="${Math.max(y(v)-5,11)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--texte)">${v>=1000?(v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" k":Math.round(v)}</text>`; }
    s+=`<text x="${x+larg/2}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="var(--doux)">${MOIS[i]}</text>`;
  });
  return s+`</svg>`;
}

function lireChamps(){
  const b=B, g=k=>$("#d_"+k), ok=x=>x&&!x.disabled;

  if(ok(g("date"))) b.date=g("date").value;

  if(ok(g("echeance"))) b.echeance=g("echeance").value;
  if(ok(g("objet"))) b.objet=g("objet").value;

function majTotaux(){

async function sauverDoc(rester, msg){
  if(bloquerSiLecture()) return false;
  lireChamps(); const b=B, coll=b.type==="devis"?"devis":"factures";
  if(!b.client){ msg("Choisissez un client (ou créez-le avec le bouton +)."); return false; }
  if(!b.lignes.some(l=>String(l.des).trim())){ msg("Ajoutez au moins une ligne avec une désignation."); return false; }
  if(!b.numero){
    if(b.type==="facture" && !(await demander("Émettre la facture ? Elle reçoit son numéro définitif et son contenu ne pourra plus être modifié.","Émettre la facture"))) return false;
    try{ b.numero = await prochainNumero(b.type==="devis"?"D":"F", b.date); }catch(err){ msg(err.message); return false; }
  }
  b.modifieLe=new Date().toISOString();
  try{ await ecrire(coll, JSON.parse(JSON.stringify(b))); }catch(err){ msg("Enregistrement impossible : "+(err.message||err.code)); return false; }
  toast((b.type==="devis"?"Devis ":"Facture ")+b.numero+" enregistré"+(b.type==="devis"?"":"e"));
  if(rester) dessinerEditeur(); else { fermerModal(); afficher(); }
  return true;
}
async function versFacture(idDevis, msg){
  const d=D.devis.find(x=>x.id===idDevis), auj=aujourd();
  if(!(await demander(`Créer la facture à partir du devis <b>${esc(d.numero)}</b> ? Elle sera datée d'aujourd'hui et recevra son numéro définitif.`,"Créer la facture"))) return;
  let num; try{ num=await prochainNumero("F",auj); }catch(err){ msg(err.message); return; }
  const f=JSON.parse(JSON.stringify(d));
  Object.assign(f,{id:uid(),type:"facture",numero:num,date:auj,echeance:plusJours(auj,D.entreprise.delaiPaiement),
    statut:"apayer",paye:false,datePaiement:"",modePaiement:"",devisOrigine:d.numero,creeLe:new Date().toISOString()});
  delete f.validite;
  await ecrire("factures", f); await ecrire("devis", {...d, statut:"facture", factureLiee:num});
  B=JSON.parse(JSON.stringify(f)); dessinerEditeur(); toast("Facture "+num+" créée");
}

async function enregistrerFichier(nom, data, type){
  if(S.downloads){
    try{ await S.downloads.save({filename:nom, data:data instanceof Blob?data:new Blob([data],{type})}); return true; }
    catch(err){ if(err.code==="declined") return false; toast("Téléchargement impossible : "+(err.message||err.code),5000); return false; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type})); a.download=nom; document.body.appendChild(a); a.click(); a.remove(); return true;
}
async function telechargerPdf(docs, bouton, nomFichier){
  if(!window.html2pdf){ toast("Le module PDF n'est pas chargé. Rechargez la page.",5000); return; }
  const ancien=bouton?.textContent; if(bouton){ bouton.disabled=true; bouton.textContent="Préparation du PDF…"; }
  try{
    const contenu='<div style="background:#fff;width:190mm">'+docs.map((d,i)=>(i?'<div class="html2pdf__page-break"></div>':"")+htmlDocument(d)).join("")+'</div>';
    const nom = nomFichier || ((docs[0].type==="devis"?"Devis ":"Facture ")+docs[0].numero+" - "+client(docs[0].client).nom).replace(/[\\/:*?"<>|]/g,"")+".pdf";
    const blob = await html2pdf().set({margin:[10,10,12,10], image:{type:"jpeg",quality:0.95}, html2canvas:{scale:2,backgroundColor:"#ffffff"},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, pagebreak:{mode:["css","legacy"]}}).from(contenu,"string").outputPdf("blob");
    if(await enregistrerFichier(nom, blob, "application/pdf")) toast("PDF prêt : "+nom);
  }catch(err){ toast("PDF impossible : "+(err.message||err),5000); }
  finally{ if(bouton){ bouton.disabled=false; bouton.textContent=ancien; } }
}

    <div class="grille" style="align-items:end">
      <div><label for="x_annee">Année</label><select id="x_annee">${opts}</select></div>
      <div><button class="btn" id="x_csv" style="width:100%">Tableau des factures (Excel)</button></div>
      <div><button class="btn" id="x_pdf" style="width:100%">Toutes les factures en PDF</button></div>
      <div><button class="btn leger" id="x_devis" style="width:100%">Tableau des devis (Excel)</button></div>
    </div>
    <p class="aide">Le tableau s'ouvre dans Excel ou LibreOffice : numéro, date, client, HT, TVA, TTC, état, date et moyen de paiement. Le PDF regroupe toutes les factures de l'année, une par page, dans l'ordre des numéros.</p>
  </div>
  <div class="carte"><div class="entete-carte"><h2>Copie de sécurité</h2></div>
    <p style="margin-top:0">Vos devis et factures sont enregistrés dans ce navigateur, sur cet appareil : rien n'est envoyé sur internet. Faites une copie de temps en temps (clé USB, cloud) : si le navigateur est vidé, vous pourrez tout récupérer, ou passer sur un autre ordinateur.</p>
    <div class="barre"><button class="btn leger" id="x_json">Télécharger une copie complète</button>
      <label class="btn leger" style="margin:0">Récupérer une copie<input type="file" id="x_import" accept=".json,application/json" hidden></label></div>
    <p class="aide" id="x_msg" role="status"></p></div>`;
  const an=()=>$("#x_annee").value;
  const num=v=>v.toFixed(2).replace(".",",");
  const csv=l=>"﻿"+l.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
  $("#x_csv").onclick=()=>{
    const l=[["Numéro","Date","Client","SIREN client","Activité","Objet","Total HT","TVA","Total TTC","Acompte","État","Échéance","Payée le","Moyen","Devis d'origine"]];
    D.factures.filter(f=>(f.date||"").startsWith(an()+"-")).sort((a,b)=>a.numero.localeCompare(b.numero)).forEach(f=>{const t=calculer(f), c=client(f.client);
      l.push([f.numero,dateFr(f.date),c.nom,c.siren||"",f.activite||"",f.objet,num(t.ht),num(t.tva),num(t.ttc),num(t.acompte),etatFacture(f)[0],dateFr(f.echeance),dateFr(f.datePaiement),f.modePaiement||"",f.devisOrigine||""]);});
    enregistrerFichier("factures-"+an()+".csv", csv(l), "text/csv");
  };
  $("#x_devis").onclick=()=>{
    const l=[["Numéro","Date","Client","Objet","Total HT","État","Valable jusqu'au","Facture"]];
    D.devis.filter(d=>(d.date||"").startsWith(an()+"-")).sort((a,b)=>a.numero.localeCompare(b.numero)).forEach(d=>l.push([d.numero,dateFr(d.date),client(d.client).nom,d.objet,num(calculer(d).ht),(ETATS_DEVIS[d.statut]||ETATS_DEVIS.brouillon)[0],dateFr(d.validite),d.factureLiee||""]));
    enregistrerFichier("devis-"+an()+".csv", csv(l), "text/csv");
  };
  $("#x_pdf").onclick=ev=>{ const fs=D.factures.filter(f=>(f.date||"").startsWith(an()+"-")).sort((a,b)=>a.numero.localeCompare(b.numero));
    if(!fs.length){ toast("Aucune facture en "+an()+"."); return; } telechargerPdf(fs, ev.target, "Factures "+an()+".pdf"); };
  $("#x_import").onchange=ev=>{ const fi=ev.target.files[0]; if(!fi) return; const rd=new FileReader();
    rd.onload=async ()=>{ try{ const x=JSON.parse(rd.result); if(!x.entreprise||!Array.isArray(x.factures)) throw 0;
      if(await demander("Remplacer les données de ce navigateur par cette copie ?","Remplacer",true)){
        D.entreprise={...ENTREPRISE_DEFAUT,...x.entreprise}; D.clients=x.clients||[]; D.devis=x.devis||[]; D.factures=x.factures; D.compteurs=x.compteurs||{}; sauverLocal(); afficher(); toast("Copie récupérée"); } }
      catch(_){ $("#x_msg").textContent="Ce fichier n'est pas une copie valide."; } }; rd.readAsText(fi); };
  $("#x_json").onclick=()=>enregistrerFichier("copie-devis-factures-"+aujourd()+".json", JSON.stringify({entreprise:D.entreprise,clients:D.clients,devis:D.devis,factures:D.factures,compteurs:D.compteurs},null,1), "application/json");
}

/* ================= Démarrage ================= */
async function demarrer(){
  afficher();
  const etat=$("#etat");
  const db = window.claude?.use ? await window.claude.use("db") : null;
  if(!db){ S.local=true; chargerLocal(); lireEssai(); if(ESSAI.fini) S.peutEcrire=false; etat.textContent="Vos données restent dans ce navigateur, sur cet appareil"; afficher(); return; }
  S.db=db; S.local=false;
  S.downloads = await window.claude.use("downloads");
  const user = await window.claude.use("user");
  if(user){ const w = await user.can("data.write"); if(w===false) S.peutEcrire=false; }
  etat.textContent = S.peutEcrire ? "Données partagées en ligne · à jour" : "Lecture seule · données partagées en ligne";
  let premier=true; const minuteur=setTimeout(()=>{ etat.textContent="Les données ne répondent pas encore… vérifiez la connexion internet."; },10000);
  ["clients","devis","factures"].forEach(coll=>{
    db.collection(coll).onSnapshot(snap=>{
      D[coll]=snap.docs.map(d=>({...d.data()})); S.charge[coll]=true;
      if(!snap.metadata.fromCache && premier){ premier=false; clearTimeout(minuteur); etat.textContent = S.peutEcrire ? "Données partagées en ligne · à jour" : "Lecture seule · données partagées en ligne"; }
      if(!$("#modal-zone").innerHTML) rafraichir();
    }, err=>{ clearTimeout(minuteur); etat.textContent="Données indisponibles ("+err.code+"). Rechargez la page."; });
  });
  db.doc("config/entreprise").onSnapshot(snap=>{ if(snap.exists) D.entreprise={...ENTREPRISE_DEFAUT, ...snap.data()}; if(!$("#modal-zone").innerHTML) rafraichir(); }, ()=>{});
}
demarrer();
</script>
